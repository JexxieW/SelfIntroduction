<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>王晶璇 Jessie Wang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F2ED;
      --ink: #1A1814;
      --muted: #8A8680;
      --accent: #C8503A;
      --line: #D9D4CB;
    }

    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    /* Layout */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 2rem;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      padding: 5rem 0 3rem;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards;
    }

    .eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.2rem;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.8rem, 8vw, 4.5rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 0.2rem;
    }

    h1 .chinese {
      color: var(--accent);
    }

    h1 .english {
      color: var(--ink);
    }

    .tagline {
      margin-top: 1.2rem;
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    /* Divider */
    .rule {
      border: none;
      border-top: 1px solid var(--line);
      margin: 2.5rem 0;
    }

    /* Bio section */
    .bio {
      opacity: 0;
      animation: fadeUp 0.8s ease 0.2s forwards;
    }

    .section-label {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .bio-text {
      font-family: 'DM Serif Display', serif;
      font-style: italic;
      font-size: 1.25rem;
      line-height: 1.7;
      color: var(--ink);
      max-width: 560px;
    }

    /* Links section */
    .links {
      margin-top: 4rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.4s forwards;
    }

    .link-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .link-item {
      border-top: 1px solid var(--line);
    }

    .link-item:last-child {
      border-bottom: 1px solid var(--line);
    }

    .link-item a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 0;
      text-decoration: none;
      color: var(--ink);
      transition: color 0.2s ease;
      gap: 1rem;
    }

    .link-item a:hover {
      color: var(--accent);
    }

    .link-item a:hover .arrow {
      transform: translateX(4px);
    }

    .link-name {
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .link-handle {
      font-size: 0.75rem;
      color: var(--muted);
      flex: 1;
      text-align: right;
      margin-right: 0.5rem;
    }

    .arrow {
      font-size: 0.9rem;
      transition: transform 0.2s ease;
      color: var(--muted);
    }

    /* Footer */
    footer {
      margin-top: 5rem;
      padding-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.6s forwards;
    }

    .footer-text {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* Animations */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Cursor dot */
    .cursor-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      position: fixed;
      pointer-events: none;
      z-index: 999;
      transition: transform 0.15s ease, opacity 0.15s ease;
      transform: translate(-50%, -50%);
    }

    @media (max-width: 480px) {
      header { padding: 3rem 0 2rem; }
      .links { margin-top: 2.5rem; }
    }
  </style>
</head>
<body>

<div class="cursor-dot" id="cursor"></div>

<div class="container">
  <header>
    <p class="eyebrow">Personal · Portfolio</p>
    <h1>
      <span class="chinese">王晶璇</span><br>
      <span class="english">Jessie Wang</span>
    </h1>
    <p class="tagline">Software Engineer · Dublin</p>
  </header>

  <hr class="rule">

  <section class="bio">
    <p class="section-label">About</p>
    <p class="bio-text">
      Engineer at the intersection of clean code and real-world impact.
      Based in Dublin, building things that matter.
    </p>
  </section>

  <section class="links">
    <p class="section-label">Find me</p>
    <ul class="link-list">
      <li class="link-item">
        <a href="https://github.com/JexxieW" target="_blank" rel="noopener">
          <span class="link-name">GitHub</span>
          <span class="link-handle">JexxieW</span>
          <span class="arrow">→</span>
        </a>
      </li>
      <li class="link-item">
        <a href="https://www.linkedin.com/in/jingxuan-jessie-wang-6975221a6/" target="_blank" rel="noopener">
          <span class="link-name">LinkedIn</span>
          <span class="link-handle">Jingxuan Jessie Wang</span>
          <span class="arrow">→</span>
        </a>
      </li>
      <li class="link-item">
        <a href="https://leetcode.com/u/jw6839/" target="_blank" rel="noopener">
          <span class="link-name">LeetCode</span>
          <span class="link-handle">jw6839</span>
          <span class="arrow">→</span>
        </a>
      </li>
    </ul>
  </section>

  <footer>
    <p class="footer-text">Dublin, Ireland · 2025</p>
  </footer>
</div>

<script>
  const cursor = document.getElementById('cursor');
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
  });
  document.addEventListener('mouseleave', () => cursor.style.opacity = '0');
  document.addEventListener('mouseenter', () => cursor.style.opacity = '1');
</script>

</body>
</html>
